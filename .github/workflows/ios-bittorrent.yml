name: iOS BitTorrent IPA

on:
  workflow_dispatch:
  push:
    branches: [feat/ios-bittorrent]

permissions:
  contents: read

concurrency:
  group: ios-bittorrent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ffmpeg:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: open-ani/mediamp
          ref: bf2e45d1c6756bf6a4fa676e8095e723bb7d3958
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable MP4 text subtitle encoding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('buildSrc/src/main/kotlin/ffmpeg/FfmpegTargets.kt')
          s = p.read_text()
          assert 'add("--enable-encoder=srt")' in s
          p.write_text(s.replace('add("--enable-encoder=srt")', 'add("--enable-encoder=srt")\n    add("--enable-encoder=movtext")'))
          PY
      - name: Fetch pinned FFmpeg source
        run: git submodule update --init --depth 1 mediamp-ffmpeg/ffmpeg
      - name: Build FFmpeg Apple runtime
        run: ./gradlew :mediamp-ffmpeg:ffmpegAppleXcframeworkZip -Pandroid.compile.sdk=36 --no-configuration-cache --max-workers=3
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-apple-movtext
          path: mediamp-ffmpeg/build/distributions/*.zip
          if-no-files-found: error

  native:
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      matrix:
        sdk: [iphoneos, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: |
            torrent/anitorrent/build/native/${{ matrix.sdk }}/lib
            torrent/anitorrent/build/native/${{ matrix.sdk }}/include
          key: anitorrent-apple-v1-${{ matrix.sdk }}-${{ hashFiles('torrent/anitorrent/native/**') }}
      - name: Build native BitTorrent library
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash torrent/anitorrent/native/build-apple.sh ${{ matrix.sdk }} torrent/anitorrent/build/native/${{ matrix.sdk }}
      - uses: actions/upload-artifact@v4
        with:
          name: anitorrent-${{ matrix.sdk }}
          path: |
            torrent/anitorrent/build/native/${{ matrix.sdk }}/lib/
            torrent/anitorrent/build/native/${{ matrix.sdk }}/include/
          if-no-files-found: error
  ipa:
    needs: [native, ffmpeg]
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anitorrent-iphoneos
          path: torrent/anitorrent/build/native/iphoneos
      - uses: actions/download-artifact@v4
        with:
          name: anitorrent-iphonesimulator
          path: torrent/anitorrent/build/native/iphonesimulator
      - name: Install JBR 21
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) arch=aarch64 ;;
            x86_64) arch=x64 ;;
            *) exit 1 ;;
          esac
          archive="jbrsdk_jcef-21.0.11-osx-${arch}-b1163.116.tar.gz"
          base="https://cache-redirector.jetbrains.com/intellij-jbr"
          curl --fail --location --retry 3 "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl --fail --location --retry 3 "$base/$archive.checksum" -o "$RUNNER_TEMP/jbr.checksum"
          expected=$(awk '{print $1}' "$RUNNER_TEMP/jbr.checksum")
          actual=$(shasum -a 512 "$RUNNER_TEMP/$archive" | awk '{print $1}')
          test "$expected" = "$actual"
          mkdir -p "$RUNNER_TEMP/jbr"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/jbr" --strip-components=1
          echo "JAVA_HOME=$RUNNER_TEMP/jbr/Contents/Home" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jbr/Contents/Home/bin" >> "$GITHUB_PATH"
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Configure iOS
        run: |
          printf '%s\n' 'ani.enable.ios=true' 'ani.build.framework=true' 'ani.android.abis=arm64-v8a' > local.properties
          # CocoaPods invokes Gradle again from Xcode without the outer CLI flags.
          printf '\n%s\n' 'android.compile.sdk=36' 'ani.anitorrent.prebuilt=true' 'kotlin.compiler.execution.strategy=in-process' 'org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8' 'org.gradle.workers.max=2' 'org.gradle.configuration-cache=false' >> gradle.properties
          xcodebuild -version
          pod --version
          sysctl hw.memsize hw.ncpu
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-apple-movtext
          path: ffmpeg-runtime
      - name: Configure playback runtime
        run: |
          runtime=$(find "$PWD/ffmpeg-runtime" -name '*.zip' -print -quit)
          test -n "$runtime"
          echo "ani.ios.ffmpegRuntime=$runtime" >> gradle.properties
      - name: Run native bridge and HTTP range tests
        run: ./gradlew :torrent:anitorrent:iosSimulatorArm64Test --tests '*NativeBridgeTest*' :app:shared:app-data:iosSimulatorArm64Test --tests '*TorrentHttpRangeTest*' --tests '*TorrentPlaybackProxyTest*' --tests '*LocalPlaybackPreparationTest*' -Pandroid.compile.sdk=36 -Pani.anitorrent.prebuilt=true -Pkotlin.compiler.execution.strategy=in-process --stacktrace --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" --max-workers=2
      - name: Build unsigned IPA
        run: |
          (while sleep 60; do echo '--- Build resource usage ---'; ps -axo pid,rss,%cpu,comm | sort -nrk 2 | head -8; done) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          ./gradlew :app:ios:podInstall :app:ios:buildDebugIpa -Pandroid.compile.sdk=36 -Pani.anitorrent.prebuilt=true -Pkotlin.compiler.execution.strategy=in-process --stacktrace --console=plain --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: animeko-ios-bittorrent-unsigned
          path: app/ios/build/archives/debug/Animeko.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-diagnostics
          path: |
            **/build/reports/
            **/build/logs/
