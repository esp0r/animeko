name: iOS VLC source synchronization tests
on:
  workflow_dispatch:
    inputs:
      trace:
        description: Record native clock and queue rate boundaries
        type: boolean
        default: true
      boundary:
        description: Test continuous presentation mapping at the audio boundary
        type: boolean
        default: true
  push:
    branches: [experiment/vlc3-clock]
permissions:
  contents: read
concurrency:
  group: vlc-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pcm-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PCM continuity measurement
        run: |
          python3 -m unittest discover -s app/ios/tests/vlc -p 'test_analyze_*.py'
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined app/ios/tests/vlc/test_pcm_probe.c -o /tmp/pcm-probe
          /tmp/pcm-probe
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined app/ios/tests/vlc/test_rate_timeline.c -o /tmp/rate-timeline
          /tmp/rate-timeline
  source:
    needs: pcm-probe
    runs-on: macos-15
    timeout-minutes: 180
    env:
      SOURCE_ROOT: ${{ github.workspace }}/.vlc-source
      MAKE_JOBS: '3'
      VLC_RATE_TRACE: ${{ github.event_name == 'push' && '1' || inputs.trace && '1' || '0' }}
      VLC_RATE_BOUNDARY: ${{ github.event_name == 'push' && '1' || inputs.boundary && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install compatible build tools
        run: brew list --versions make pkgconf >/dev/null || brew install make pkgconf
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.SOURCE_ROOT }}
          key: vlc374-source-arm64-v1-${{ github.run_id }}
          restore-keys: vlc374-source-arm64-v1-
      - name: Build pinned VLC source
        run: |
          set -o pipefail
          bash app/ios/tests/vlc/build-source.sh "$SOURCE_ROOT" 2>&1 | tee vlc-source-build.log
      - name: Verify source framework with the production adapter
        env:
          VLC_SOURCE_FRAMEWORK: ${{ env.SOURCE_ROOT }}/build/source-simulator.xcarchive/Products/Library/Frameworks/MobileVLCKit.framework
        run: bash app/ios/tests/vlc/run.sh
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.SOURCE_ROOT }}
          key: vlc374-source-arm64-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vlc-source-diagnostics
          path: |
            vlc-source-build.log
            app/ios/tests/vlc/build/*.log
            app/ios/tests/vlc/build/*.json
