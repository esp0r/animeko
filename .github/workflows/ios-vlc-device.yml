name: iOS VLC device framework
on:
  workflow_dispatch:
  push:
    branches: [experiment/vlc3-clock]
    paths:
      - '.github/workflows/ios-vlc-device.yml'
      - 'app/ios/tests/vlc/build-source.sh'
      - 'app/ios/tests/vlc/patches/clock-boundary.patch'
      - 'app/ios/tests/vlc/rate_timeline.h'
permissions:
  contents: read
concurrency:
  group: vlc-device-${{ github.ref }}
  cancel-in-progress: false
jobs:
  device:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      SOURCE_ROOT: ${{ github.workspace }}/.vlc-device
      VLC_SOURCE_PLATFORM: device
      VLC_RATE_TRACE: '1'
      VLC_RATE_BOUNDARY: '1'
      MAKE_JOBS: '3'
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew list --versions make pkgconf >/dev/null || brew install make pkgconf
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.SOURCE_ROOT }}
          key: vlc374-device-arm64-v1-${{ github.run_id }}
          restore-keys: vlc374-device-arm64-v1-
      - name: Build pinned device framework
        run: |
          set -o pipefail
          bash app/ios/tests/vlc/build-source.sh "$SOURCE_ROOT" 2>&1 | tee vlc-device-build.log
      - name: Package arm64 iOS framework
        run: |
          set -euo pipefail
          framework="$SOURCE_ROOT/build/source-device.xcarchive/Products/Library/Frameworks/MobileVLCKit.framework"
          test "$(lipo -archs "$framework/MobileVLCKit")" = arm64
          xcrun vtool -show-build "$framework/MobileVLCKit" | tee vlc-device-platform.txt
          grep -Eq 'platform IOS$' vlc-device-platform.txt
          ditto -c -k --sequesterRsrc --keepParent "$framework" MobileVLCKit-device.zip
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          archive = Path('MobileVLCKit-device.zip')
          manifest = {'commit': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'],
                      'platform': 'iOS', 'architecture': 'arm64',
                      'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
                      'diagnostic_build': True}
          Path('vlc-device-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vlc-device-framework
          path: |
            MobileVLCKit-device.zip
            vlc-device-manifest.json
            vlc-device-platform.txt
            vlc-device-build.log
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ env.SOURCE_ROOT }}
          key: vlc374-device-arm64-v1-${{ github.run_id }}
